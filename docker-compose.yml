services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: aero-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:-SysPass_123}
      APP_USER: ${ORACLE_USER:-vector_user}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:-VectorPass_123}
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  oracle-data:
